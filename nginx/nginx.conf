events {
    worker_connections 1024;
}

http {
    upstream books_api {
        server books-api:5000;
    }

    upstream staff_api {
        server staff-api:5000;
    }

    upstream readers_api {
        server readers-api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy';
        }

        # Books API endpoints
        location /api/books {
            proxy_pass http://books_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Staff API endpoints
        location /api/staff {
            proxy_pass http://staff_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Readers API endpoints
        location /api/readers {
            proxy_pass http://readers_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}